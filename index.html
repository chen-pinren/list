<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的一天 - 待办事项</title>
  <link rel="stylesheet" href="todo.css">
</head>
<body>
  <div class="container">
    <h1>我的一天</h1>

    <!-- 新增任务 -->
    <div class="new-task">
      <img class="todo-plus-icon" src="plus.png" alt="添加">
      <input type="text" placeholder="添加新任务..." id="taskInput">
      <button class="add-btn" id="addBtn">添加</button>
    </div>

    <!-- 待办 -->
    <div class="todo-list card" id="todoList">
      <div class="empty-state">暂无待办任务</div>
    </div>

    <!-- 已完成 -->
    <div class="done-list card" id="doneList">
      <div class="empty-state">暂无已完成任务</div>
    </div>
  </div>

  <script src="todo.js"></script>
</body>
</html>
